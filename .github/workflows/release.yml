name: Release

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "构建 Android APK"
        type: boolean
        default: true
      build_macos:
        description: "构建 macOS DMG"
        type: boolean
        default: true
      build_ios:
        description: "构建 iOS IPA（无签名）"
        type: boolean
        default: true
      tag:
        description: "发布 tag（留空只出构建产物，不建 Release）"
        type: string
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: 韩小圈

jobs:
  android:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_android == 'true' }}
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 版本号
        run: bash tool/ci_version.sh android

      - name: 拉依赖
        run: flutter pub get

      - name: 打 SDK / 包补丁
        shell: bash
        run: bash tool/ci_patch.sh android

      - name: 构建 APK
        run: flutter build apk --release --split-per-abi --dart-define-from-file=ci_build.json --no-pub

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$f" | sed -E 's|.*app-(.*)-release\.apk|\1|')
            cp "$f" "dist/HanjuTV_android_${VERSION}_${abi}.apk"
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  macos:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_macos == 'true' }}
    name: macOS DMG
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 版本号
        run: bash tool/ci_version.sh macos

      - name: 拉依赖
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config --enable-macos-arm64-only
          flutter pub get

      - name: 打 SDK / 包补丁
        shell: bash
        run: bash tool/ci_patch.sh macos

      - name: 构建 macOS
        run: flutter build macos --release --dart-define-from-file=ci_build.json --no-pub

      - name: 定位 .app
        id: app
        shell: bash
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -1)
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "APP=$APP"
          du -sh "$APP"

      - name: 打包 DMG
        shell: bash
        run: |
          mkdir -p dist
          npm install --global create-dmg || true
          create-dmg --volname "韩小圈" \
            --volicon "macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png" \
            --window-size 660 400 --icon-size 128 --app-drop-link 500 200 \
            "dist/HanjuTV_macos_${VERSION}.dmg" "${{ steps.app.outputs.path }}" || true
          ls -lh dist

      - name: 打包 ZIP
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "${{ steps.app.outputs.path }}" "dist/HanjuTV_macos_${VERSION}.zip"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  ios:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_ios == 'true' }}
    name: iOS IPA（无签名）
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: 版本号
        run: bash tool/ci_version.sh ios

      - name: 拉依赖
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: 打 SDK / 包补丁
        shell: bash
        run: bash tool/ci_patch.sh ios

      - name: 生成 Xcode 工程
        run: flutter build ios --release --config-only --dart-define-from-file=ci_build.json --no-pub

      - name: 构建 iOS（关闭签名）
        shell: bash
        run: |
          set -o pipefail
          cd ios
          xcodebuild             -workspace Runner.xcworkspace             -scheme Runner             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -archivePath ../build/ios/Runner.xcarchive             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             CODE_SIGN_ENTITLEMENTS=""             DEVELOPMENT_TEAM=""             PROVISIONING_PROFILE_SPECIFIER=""             archive

      - name: 打包 IPA
        shell: bash
        run: |
          mkdir -p dist Payload
          APP=$(find build/ios/Runner.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          [ -n "$APP" ] || APP=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "APP=$APP"
          cp -R "$APP" Payload/
          zip -qry "dist/HanjuTV_ios_${VERSION}_unsigned.ipa" Payload
          rm -rf Payload
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: 发布正式版
    needs: [android, macos, ios]
    if: ${{ always() && (github.event_name == 'push' || github.event.inputs.tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: 整理产物
        shell: bash
        run: |
          mkdir -p dist
          if [ -d artifacts ]; then
            find artifacts -type f \( -name '*.apk' -o -name '*.dmg' -o -name '*.zip' -o -name '*.ipa' \) -exec cp {} dist/ \;
          fi
          ls -lh dist || true
          test "$(ls -A dist | wc -l)" -gt 0

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
          name: 韩小圈 ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}
          body: |
            韩小圈客户端构建产物。

            - **Android**：`HanjuTV_android_*_<abi>.apk`（arm64-v8a / armeabi-v7a / x86_64 三包，debug 签名，可直接侧载）
            - **macOS**：`HanjuTV_macos_*.dmg` 与 `.zip`（未签名，首次打开需右键 →「打开」）
            - **iOS**：`HanjuTV_ios_*_unsigned.ipa`（未签名，需自签工具如 Sideloadly / AltStore 安装）
          files: dist/*
          draft: false
          prerelease: false
